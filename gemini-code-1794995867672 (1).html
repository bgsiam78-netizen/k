<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>-RGX VIP PREDICTOR</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700;900&display=swap" rel="stylesheet" />

    <style>
        :root { 
            --primary: #00d2ff;
            --accent: #0072ff;
            --bg: #030914;
            --card-bg: rgba(8, 18, 36, 0.95); 
            --text-gold: #00d2ff;
            --nav-height: 70px;
        }
        
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Outfit', sans-serif; }
        
        html, body {
            height: 100%;
            width: 100vw;
            background-color: var(--bg);
            color: white;
        }

        body { 
            overflow: hidden; 
            display: flex;
            flex-direction: column;
            height: 100dvh; 
        }
        
        .full-page { 
            height: 100%; 
            width: 100vw; 
            display: flex; 
            flex-direction: column; 
            position: relative;
        }
        
        #activation-scr { position: fixed; inset: 0; background: #000; display: flex; align-items: center; justify-content: center; z-index: 9000; }
        .activation-card { background: #061124; padding: 25px; border-radius: 25px; border: 1px solid var(--primary); width: 92%; max-width: 380px; text-align: center; box-shadow: 0 0 25px rgba(0, 210, 255, 0.2); }
        
        .notice-text { color: #fff; font-size: 13px; line-height: 1.5; margin-bottom: 25px; padding: 12px; border-radius: 12px; background: rgba(0, 210, 255, 0.08); border-left: 4px solid var(--primary); text-align: left; }
        .btn-reg-main { width: 100%; padding: 15px; background: linear-gradient(90deg, var(--primary), #0099ff); border: none; border-radius: 12px; color: #000; font-weight: 900; cursor: pointer; margin-bottom: 25px; text-transform: uppercase; font-size: 14px; box-shadow: 0 4px 15px rgba(0, 210, 255, 0.3); }
        
        .activation-card input { width: 100%; padding: 14px; margin-bottom: 15px; border-radius: 12px; border: 1px solid #132a4a; background: #000; color: #fff; text-align: center; outline: none; font-size: 15px; letter-spacing: 2px; }
        .activation-card button#submit-btn { width: 100%; padding: 14px; background: #fff; border: none; border-radius: 12px; color: #000; font-weight: 900; cursor: pointer; transition: 0.3s; }
        .activation-card button#submit-btn:hover { background: var(--primary); }

        .content-area { 
            flex: 1; 
            position: relative; 
            overflow: hidden; 
            height: calc(100% - var(--nav-height));
        }

        .tab-content { 
            display: none; 
            height: 100%; 
            width: 100%; 
            overflow-y: auto; 
            -webkit-overflow-scrolling: touch; 
        }
        .tab-content.active { display: block; }
        
        #game-tab iframe { width: 100%; height: 100%; border: none; }

        .hack-container { padding: 20px; padding-bottom: 40px; max-width: 500px; margin: auto; }
        
        .header-title { font-size: 22px; font-weight: 900; text-align: center; margin: 20px 0; color: #fff; text-transform: uppercase; letter-spacing: 1px; text-shadow: 0 0 10px rgba(0, 210, 255, 0.4); }
        .header-title span.brand { color: var(--primary); }
        .header-title span.highlight { color: #ff477e; text-shadow: 0 0 10px rgba(255, 71, 126, 0.4); }
        
        .main-card { background: var(--card-bg); border: 1px solid rgba(0, 210, 255, 0.3); border-radius: 25px; padding: 25px; position: relative; box-shadow: 0 10px 40px rgba(0, 0, 0, 0.6); text-align: center; margin-bottom: 20px; }
        
        .timer-ring { position: absolute; top: 15px; right: 20px; color: #ff477e; font-weight: 900; background: rgba(255, 71, 126, 0.1); padding: 2px 8px; border-radius: 8px; }
        .pred-row { display: flex; justify-content: space-around; align-items: center; margin: 30px 0; }
        .bs-display { font-size: 55px; font-weight: 900; color: #fff; text-shadow: 0 0 15px var(--primary); }
        .num-box { width: 75px; height: 75px; border: 3px solid var(--primary); border-radius: 20px; display: flex; align-items: center; justify-content: center; font-size: 28px; font-weight: 900; color: var(--primary); box-shadow: inset 0 0 10px rgba(0, 210, 255, 0.2); }
        
        .confidence-bg { height: 10px; background: #0a1830; border-radius: 10px; margin: 15px 0; overflow: hidden; }
        .confidence-bar { height: 100%; background: linear-gradient(90deg, var(--primary), var(--accent)); width: 0%; transition: 1s ease-in-out; }
        
        .stats-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; margin-bottom: 25px; }
        .s-box { background: rgba(0, 210, 255, 0.03); border: 1px solid rgba(0, 210, 255, 0.15); padding: 18px 10px; border-radius: 20px; text-align: center; }
        .s-box label { display: block; font-size: 11px; color: #8fa0bd; margin-bottom: 5px; text-transform: uppercase; }
        .s-box span { display: block; font-size: 24px; font-weight: 900; }

        table { width: 100%; border-collapse: collapse; text-align: center; background: rgba(8,20,41,0.6); border-radius: 15px; overflow: hidden; margin-bottom: 20px; }
        th { padding: 12px; color: var(--primary); border-bottom: 2px solid #132a4a; font-size: 10px; text-transform: uppercase; }
        td { padding: 14px; border-bottom: 1px solid #0b1a30; font-size: 12px; }
        
        .sig-big { color: #00d2ff; font-weight: 900; text-shadow: 0 0 5px rgba(0, 210, 255, 0.3); }
        .sig-small { color: #ff00ea; font-weight: 900; text-shadow: 0 0 5px rgba(255, 0, 234, 0.3); }
        
        .result-badge { padding: 4px 10px; border-radius: 6px; font-size: 10px; font-weight: 900; text-transform: uppercase; }
        .win { color: #00d2ff; border: 1px solid #00d2ff; background: rgba(0, 210, 255, 0.1); }
        .loss { color: #ff477e; border: 1px solid #ff477e; background: rgba(255, 71, 126, 0.1); }
        .jackpot { color: #00d2ff; border: 1px solid #00d2ff; box-shadow: 0 0 10px rgba(0, 210, 255, 0.5); background: rgba(0, 210, 255, 0.2); animation: blink 1s infinite; }

        @keyframes blink {
            50% { opacity: 0.6; }
        }

        .bottom-nav { 
            display: flex; 
            justify-content: space-around; 
            background: #030914; 
            border-top: 2px solid var(--primary); 
            width: 100%; 
            height: var(--nav-height);
            z-index: 8000; 
            padding-bottom: max(env(safe-area-inset-bottom), 12px);
            position: relative;
        }
        .nav-item { cursor: pointer; opacity: 0.4; transition: 0.3s; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; color: #fff; flex: 1; height: 100%; }
        .nav-item.active { opacity: 1; color: var(--primary); }
        .nav-item span { font-size: 10px; font-weight: 900; text-transform: uppercase; }

        #reg-frame-container { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; z-index: 10000; display: none; }
        .reg-header { height: 60px; background: #061124; display: flex; align-items: center; padding: 0 15px; border-bottom: 1px solid var(--primary); }
    </style>
</head>
<body>

    <div id="reg-frame-container">
        <div class="reg-header">
            <button style="background:#ff477e; color:white; border:none; padding:8px 15px; border-radius:8px; font-weight:bold; cursor:pointer;" onclick="closeRegFrame()">BACK</button>
            <span style="color:white; margin-left:20px; font-weight:bold;">OFFICIAL REGISTRATION</span>
        </div>
        <iframe id="reg-iframe" src="" style="width:100%; height:calc(100% - 60px); border:none;"></iframe>
    </div>

    <div id="activation-scr">
        <div class="activation-card">
            <h2 style="color:var(--primary); margin-bottom:15px; font-weight:900; letter-spacing:1px;">HACK LOGIN</h2>
            <div class="notice-text">
                নিচের <b>Registration Now</b> থেকে একাউন্ট করে পাসওয়ার্ড দিয়ে লগইন করুন।
            </div>
            <button class="btn-reg-main" onclick="openRegFrame()">Registration Now</button>
            <input type="password" id="pass-input" placeholder="Enter Password" onkeypress="if(event.key==='Enter') checkPassword()" />
            <button id="submit-btn" onclick="checkPassword()">LOGIN</button>
            <a href="https://t.me/RGX_community_1" class="admin-link" style="display: block; margin-top: 15px; color: var(--primary); text-decoration: none; font-size: 12px; border: 1px solid var(--primary); padding: 10px; border-radius: 10px;">CONTACT ADMIN FOR ACCESS</a>
            <div id="status-msg" style="margin-top:15px; font-weight:bold; font-size:13px;"></div>
        </div>
    </div>

    <div id="main-panel" class="full-page" style="display:none;">
        <div class="content-area">
            <div id="game-tab" class="tab-content active">
                <iframe src="https://dkwin2.us.cc"></iframe>
            </div>

            <div id="hack-tab" class="tab-content">
                <div class="hack-container">
                    <div class="header-title"><span class="brand">EFTI AI COMMUNITY</span> - <span class="highlight">HACK</span></div>
                    <div class="main-card">
                        <div class="timer-ring">NEXT: <span id="cd">--</span>s</div>
                        <div style="font-size: 13px; color: #8fa0bd; text-align: left; font-weight: bold;">PERIOD: <span id="issue" style="color:var(--primary);">...</span></div>
                        <div id="num-signal-box" style="font-weight:900; color:var(--primary); margin-top:12px; font-size: 14px;">JACKPOT NUM: --, --</div>
                        <div class="pred-row">
                            <div id="bs-text" class="bs-display">---</div>
                            <div id="num-text" class="num-box">?</div>
                        </div>
                        <div style="display: flex; justify-content: space-between; font-size: 11px; margin-bottom: 5px; color: #bbb; font-weight: bold;">
                            <span>ANALYSIS ACCURACY</span>
                            <span id="conf-val" style="color:var(--primary)">0%</span>
                        </div>
                        <div class="confidence-bg"><div id="conf-bar" class="confidence-bar"></div></div>
                    </div>
                    
                    <div class="stats-grid">
                        <div class="s-box"><label>WIN</label><span id="wins" style="color:#00d2ff">0</span></div>
                        <div class="s-box"><label>LOSS</label><span id="loss" style="color:#ff477e">0</span></div>
                        <div class="s-box"><label>ACCURACY</label><span id="acc" style="color:var(--primary)">0%</span></div>
                        <div class="s-box"><label>STREAK</label><span id="stk" style="color:var(--primary)">0</span></div>
                    </div>

                    <table>
                        <thead><tr><th>PERIOD</th><th>SIGNAL</th><th>RESULT</th><th>STATUS</th></tr></thead>
                        <tbody id="logs"></tbody>
                    </table>
                </div>
            </div>
        </div>

        <div class="bottom-nav">
            <div class="nav-item active" onclick="switchTab('game', this)">
                <span style="font-size: 24px;">🎯</span>
                <span>PLAY GAME</span>
            </div>
            <div class="nav-item" onclick="switchTab('hack', this)">
                <span style="font-size: 24px;">⚡</span>
                <span>HACK TOOLS</span>
            </div>
        </div>
    </div>

    <script>
        const API_URL = "https://draw.ar-lottery01.com/WinGo/WinGo_30S/GetHistoryIssuePage.json";
        const SINGLE_PASS = "NNN";

        function openRegFrame() {
            document.getElementById('reg-iframe').src = "https://dkwin2.us.cc";
            document.getElementById('reg-frame-container').style.display = 'block';
        }

        function closeRegFrame() {
            document.getElementById('reg-frame-container').style.display = 'none';
        }

        function switchTab(tab, el) {
            document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            document.getElementById(tab + '-tab').classList.add('active');
            el.classList.add('active');
        }

        function checkPassword() {
            const enteredPass = document.getElementById('pass-input').value.trim();
            const statusMsg = document.getElementById('status-msg');

            if (enteredPass === SINGLE_PASS) {
                document.getElementById('activation-scr').style.display = 'none';
                document.getElementById('main-panel').style.display = 'flex';
                initHack();
            } else {
                statusMsg.innerText = "WRONG PASSWORD!";
                statusMsg.style.color = "#ff477e";
            }
        }

        let state = { lastPeriod: null, nextPeriod: null, nextNums: [], currentLevel: 1, wins: 0, loss: 0, streak: 0, logs: [] };

        function initHack() { 
            fetchData(); 
            setInterval(fetchData, 2000); 
            setInterval(() => {
                let t = 30 - (new Date().getSeconds() % 30);
                document.getElementById('cd').innerText = t < 10 ? '0' + t : t;
            }, 1000);
        }

        async function fetchData() {
            try {
                const r = await fetch(API_URL + "?ts=" + Date.now());
                const j = await r.json();
                if (j.code === 0) processHybrid(j.data.list);
            } catch (e) {}
        }

        function processHybrid(list) {
            const top = list[0];
            const p = top.issueNumber;
            const num = parseInt(top.number);
            const actualBS = num >= 5 ? "BIG" : "SMALL";

            if (state.lastPeriod !== p) {
                if (state.nextPeriod) {
                    let status = "LOSS";
                    
                    if (state.nextNums.includes(num)) { 
                        status = "JACKPOT"; 
                        state.wins++; 
                        state.streak++; 
                        state.currentLevel = 1; 
                    }
                    else if (state.nextPeriod === actualBS) { 
                        status = "WIN"; 
                        state.wins++; 
                        state.streak++; 
                        state.currentLevel = 1; 
                    }
                    else { 
                        status = "LOSS";
                        state.loss++; 
                        state.streak = 0; 
                        state.currentLevel = (state.currentLevel % 5) + 1; 
                    }
                    
                    state.logs.unshift({ p: p, signal: state.nextPeriod, res: actualBS + " (" + num + ")", status: status });
                    updateUIStats(); 
                    renderLogs();
                }
                state.lastPeriod = p;
                updatePrediction(list);
            }
        }

        function updatePrediction(list) {
            const recent = list.slice(0, 10).map(item => parseInt(item.number));
            const bigCount = recent.filter(n => n >= 5).length;
            const nextBS = bigCount >= 5 ? "SMALL" : "BIG";

            const pool = nextBS === "BIG" ? [5, 6, 7, 8, 9] : [0, 1, 2, 3, 4];
            const shuffled = pool.sort(() => 0.5 - Math.random());
            const pickedNums = [shuffled[0], shuffled[1]].sort((a, b) => a - b);
            const confidence = Math.floor(Math.random() * 16) + 80;

            state.nextPeriod = nextBS;
            state.nextNums = pickedNums;

            document.getElementById('issue').innerText = String(BigInt(state.lastPeriod) + 1n);
            document.getElementById('bs-text').innerText = state.nextPeriod;
            document.getElementById('num-text').innerText = ["1X", "3X", "9X", "27X", "81X"][state.currentLevel - 1];
            document.getElementById('num-signal-box').innerText = "JACKPOT NUM: " + state.nextNums.join(', ');
            document.getElementById('conf-val').innerText = confidence + "%";
            document.getElementById('conf-bar').style.width = confidence + "%";
        }

        function updateUIStats() {
            const total = state.wins + state.loss;
            document.getElementById('wins').innerText = state.wins;
            document.getElementById('loss').innerText = state.loss;
            document.getElementById('acc').innerText = total > 0 ? Math.round((state.wins / total) * 100) + "%" : "0%";
            document.getElementById('stk').innerText = state.streak;
        }

        function renderLogs() {
            let h = "";
            state.logs.forEach(x => {
                let cl = x.status.toLowerCase(); 
                let sigClass = x.signal === "BIG" ? "sig-big" : "sig-small";
                h += `<tr><td>${x.p.slice(-4)}</td><td class="${sigClass}">${x.signal}</td><td>${x.res}</td><td><span class="result-badge ${cl}">${x.status}</span></td></tr>`;
            });
            document.getElementById('logs').innerHTML = h;
        }
    </script>
</body>
</html>
